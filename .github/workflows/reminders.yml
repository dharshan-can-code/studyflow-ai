name: Send study reminders

on:
  # GitHub often starts scheduled runs hours late, so this is only a backup.
  # The on-time trigger is supabase/reminder_trigger.sql (or any cron service)
  # calling this workflow's "workflow_dispatch" every 10 minutes.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Never let two runs overlap, or a student could get the same email twice.
concurrency:
  group: send-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install "supabase>=2.0.0" tzdata

      - name: Send reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python send_reminders.py
